name: public-release-publish-retry
run-name: release retry ${{ inputs.candidate }} attempt ${{ inputs.attempt }} request ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Private release candidate identifier
        required: true
      attempt:
        description: Private release attempt number
        required: true
      product_sha:
        description: Original promoted product SHA
        required: true
      release_sha:
        description: Expected current public main SHA
        required: true
      request_id:
        description: Private retry workflow run ID
        required: true

permissions:
  contents: read
  actions: read
  id-token: none

concurrency:
  group: public-release-publish
  cancel-in-progress: false

env:
  INPUT_PRODUCT_SHA: ${{ inputs.product_sha }}
  INPUT_RELEASE_SHA: ${{ inputs.release_sha }}

jobs:
  authorize_retry:
    name: authorize release retry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Validate retry actor, lineage, and exact main checks
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_ACTOR: ${{ github.actor }}
          EXPECTED_RETRY_ACTOR: ${{ vars.PROMOTION_APP_ACTOR }}
        run: |
          python3 .github/scripts/public_release_retry_guard.py \
            --repo "${{ github.repository }}" \
            --repo-root . \
            --policy .github/public-ops-managed-paths.json \
            --actor "$RETRY_ACTOR" \
            --expected-actor "$EXPECTED_RETRY_ACTOR" \
            --product-sha "$INPUT_PRODUCT_SHA" \
            --release-sha "$INPUT_RELEASE_SHA"

  semantic_release_retry:
    name: semantic-release-retry
    runs-on: ubuntu-latest
    needs: authorize_retry
    environment: public-release-publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.13.0"
          cache: npm
      - name: Verify immutable release SHA
        run: test "$(git rev-parse HEAD)" = "$INPUT_RELEASE_SHA"
      - name: Install release dependencies
        run: npm ci
      - name: Mint release-tag GitHub App token
        id: release-tag-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_TAG_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_TAG_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Retry semantic-release
        env:
          GH_TOKEN: ${{ steps.release-tag-token.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          npx semantic-release
